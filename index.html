<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#315edb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PE 재고관리">
  <link rel="apple-touch-icon" href="app-icon.png">
  <link rel="icon" href="app-icon.png">
  <title>PE 온라인 판매 재고관리</title>
  <style>
    :root{--navy:#0c1b36;--navy2:#13294d;--blue:#2563eb;--blue2:#3b82f6;--pale:#eef4ff;--ink:#111827;--muted:#6b7280;--line:#e5eaf2;--bg:#f3f6fb;--card:#fff;--ok:#15966b;--warn:#e5484d;--amber:#f59e0b}
    *{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1080px;margin:auto;min-height:100vh;padding:22px 22px 104px}
    header{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:142px;padding:26px 28px 52px;margin-bottom:-30px;border-radius:28px;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;overflow:hidden;box-shadow:0 18px 45px #0c1b3628}
    header:after{content:"";position:absolute;width:220px;height:220px;right:-65px;top:-105px;border:42px solid #ffffff0a;border-radius:50%}
    .brand{position:relative;z-index:1;display:flex;align-items:center;gap:14px}.logo{display:block;width:58px;height:58px;border-radius:18px;object-fit:cover;box-shadow:0 9px 22px #0004;border:1px solid #ffffff36}
    h1{font-size:24px;letter-spacing:-.5px;margin:0}.sub{font-size:12px;color:#b9c7de;margin-top:6px}.refresh{position:relative;z-index:1;border:1px solid #ffffff30;background:#ffffff12;color:#fff;border-radius:13px;padding:10px 14px;font-weight:800;backdrop-filter:blur(8px)}
    .summary{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 20px 22px}.metric{background:var(--card);border:1px solid #fff;border-radius:18px;padding:17px 18px;box-shadow:0 12px 30px #17294c12}
    .metric span{display:block;font-size:12px;color:var(--muted);font-weight:700}.metric strong{display:block;font-size:27px;line-height:1;margin-top:10px;letter-spacing:-1px}.metric:nth-child(2) strong{color:var(--blue)}.metric.warn strong{color:var(--warn)}
    .tabs{display:flex;gap:6px;background:#e7ecf4;border-radius:15px;padding:5px;margin-bottom:16px}.tab{flex:1;border:0;background:transparent;border-radius:11px;padding:12px 8px;font-size:14px;font-weight:850;color:#737b8c;transition:.2s}.tab.active{background:var(--card);color:var(--blue);box-shadow:0 4px 14px #17294c14}
    .panel{display:none;animation:fade .18s ease}.panel.active{display:block}@keyframes fade{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}
    .toolbar{display:flex;gap:10px;margin-bottom:12px}.search,.filter,.field{border:1px solid var(--line);background:var(--card);outline:none;transition:.18s}.search{flex:1;border-radius:14px;padding:13px 15px}.filter{border-radius:14px;padding:0 14px;color:#374151;font-weight:700}.search:focus,.field:focus{border-color:#82a8ff;box-shadow:0 0 0 4px #2563eb12}
    .table-card,.form-card{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 9px 26px #17294c0b}table{width:100%;border-collapse:collapse}th{background:#f7f9fc;color:#647087;font-size:11px;letter-spacing:.2px;text-align:center;padding:14px 11px}td{padding:15px 11px;border-top:1px solid #edf0f5;text-align:center;font-size:14px}td.name{text-align:left;font-weight:800}.product-main{display:flex;align-items:center;gap:12px}.product-thumb{width:58px;height:58px;flex:none;object-fit:cover;border-radius:13px;background:#eef3f9;border:1px solid #e3e8f0}.product-copy{min-width:0;flex:1}.product-title{display:block}.stock-track{height:5px;margin-top:9px;overflow:hidden;border-radius:5px;background:#e8eef9}.stock-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#65a0ff)}.stock{font-weight:900;color:var(--navy)}.low{color:var(--warn)}
    .badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e6f7f0;color:var(--ok);font-size:11px;font-weight:850}.badge.low{background:#ffeded;color:var(--warn)}
    .form-card{padding:25px;max-width:650px;margin:auto}.form-card h2{margin:0 0 6px;font-size:22px;letter-spacing:-.4px}.hint{color:var(--muted);font-size:13px;margin:0 0 22px}.form-card label{display:block;font-size:12px;font-weight:850;color:#465064;margin:16px 0 8px}.field{width:100%;border-radius:13px;padding:13px 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.qty button{width:48px;align-self:stretch;border:0;background:var(--pale);font-size:21px;color:var(--blue)}.qty input{width:100%;border:0;text-align:center;padding:12px;outline:none;font-weight:900}.primary{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;padding:15px;margin-top:23px;box-shadow:0 10px 24px #2563eb35}.primary:disabled{opacity:.55;cursor:wait}
    .history{display:grid;gap:10px}.history-item{display:grid;grid-template-columns:1fr auto;gap:6px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:0 5px 16px #17294c08}.history-item strong{font-size:14px}.history-item time,.history-item small{color:var(--muted);font-size:12px}.history-item b{grid-row:1/3;grid-column:2;align-self:center;color:var(--blue)}
    .empty{text-align:center;color:var(--muted);background:#fff;border:1px dashed #cfd7e5;border-radius:18px;padding:46px 18px}.loading{padding:46px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:20;white-space:nowrap;box-shadow:0 10px 30px #0003}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:650px){body{background:#f4f7fb}.app{padding:0 14px 98px}header{min-height:126px;margin:0 -14px -25px;border-radius:0 0 28px 28px;padding:24px 20px 48px}.logo{width:52px;height:52px;border-radius:16px}h1{font-size:20px}.refresh{font-size:0;width:42px;height:42px;padding:0}.refresh:after{content:'↻';font-size:23px}.summary{gap:8px;margin:0 0 17px}.metric{border-radius:16px;padding:14px 12px}.metric strong{font-size:22px}.tabs{position:fixed;left:12px;right:12px;bottom:10px;z-index:10;margin:0;padding:6px;border:1px solid #dde3ee;background:#fff;box-shadow:0 14px 38px #0c1b3633;padding-bottom:max(6px,env(safe-area-inset-bottom))}.tab{min-height:47px;font-size:13px}.tab.active{background:var(--pale);box-shadow:none}.toolbar{display:grid;grid-template-columns:1fr auto}.filter{max-width:142px}.table-card{background:transparent;border:0;box-shadow:none}table,tbody{display:block}thead{display:none}tr{display:grid;grid-template-columns:1fr auto auto;gap:4px;background:#fff;border:1px solid var(--line);border-radius:17px;margin-bottom:10px;padding:14px;box-shadow:0 6px 18px #17294c09}td{border:0;padding:2px 6px;font-size:12px}td.name{grid-column:1/4;font-size:15px;padding:0 0 12px;color:var(--navy)}.product-thumb{width:68px;height:68px;border-radius:15px}.product-title{line-height:1.35}.stock-track{margin-top:11px}td:nth-child(2)::before{content:'제작 ';color:#8a93a3}td:nth-child(3)::before{content:'판매 ';color:#8a93a3}td:nth-child(4)::before{content:'재고 ';color:#8a93a3}td:nth-child(5){grid-column:1/4;text-align:right;margin-top:6px}.form-card{padding:20px 17px;border-radius:18px}.row{grid-template-columns:1fr}.toast{bottom:88px}.empty{padding:50px 18px}}
  </style>
</head>
<body>
<main class="app">
  <header><div class="brand"><img class="logo" src="app-icon.png" alt="온라인 판매 재고관리 로고"><div><h1>온라인 판매 재고관리</h1><div class="sub" id="updated">구글시트 연결 중</div></div></div><button class="refresh" id="refresh">새로고침</button></header>
  <section class="summary"><div class="metric"><span>등록 상품</span><strong id="productCount">-</strong></div><div class="metric"><span>총 재고</span><strong id="totalStock">-</strong></div><div class="metric warn"><span>안전재고 이하</span><strong id="lowCount">-</strong></div></section>
  <nav class="tabs" aria-label="메뉴"><button class="tab active" data-tab="inventory">재고현황</button><button class="tab" data-tab="sale">판매등록</button><button class="tab" data-tab="history">판매내역</button></nav>

  <section class="panel active" id="inventory"><div class="toolbar"><input class="search" id="search" placeholder="제품명 검색"><select class="filter" id="filter"><option value="all">전체 재고</option><option value="low">안전재고 이하</option></select></div><div class="table-card"><div class="loading" id="inventoryLoading">재고를 불러오는 중입니다</div><table id="inventoryTable" hidden><thead><tr><th>제품명</th><th>제작</th><th>판매</th><th>현재 재고</th><th>상태</th></tr></thead><tbody id="inventoryBody"></tbody></table></div></section>

  <section class="panel" id="sale"><form class="form-card" id="saleForm"><h2>판매 등록</h2><p class="hint">판매 수량을 등록하면 상품 재고와 판매내역에 반영됩니다.</p><label for="saleDate">판매일</label><input class="field" type="date" id="saleDate" required><label for="product">제품</label><select class="field" id="product" required><option value="">제품을 선택하세요</option></select><div class="row"><div><label for="channel">판매처</label><select class="field" id="channel"><option>쿠팡</option><option>네이버 스마트스토어</option><option>전화 주문</option><option>기타</option></select></div><div><label for="quantity">판매수량</label><div class="qty"><button type="button" data-step="-1">−</button><input id="quantity" type="number" min="1" value="1" required><button type="button" data-step="1">＋</button></div></div></div><label for="note">비고</label><textarea class="field" id="note" rows="3" placeholder="필요한 내용이 있을 때만 입력"></textarea><button class="primary" id="saleSubmit">판매 등록하기</button></form></section>

  <section class="panel" id="history"><div class="history" id="historyList"><div class="empty">등록된 판매내역이 없습니다.</div></div></section>
</main><div class="toast" id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbwmlaSve9tLcpRCitEUnF3x6l_91U9rTUYKO_tCbcjqfqTc_MwyctI43MBx6-gFfjzRqg/exec';
let products=[],sales=[];
const PRODUCT_IMAGES={1:'images/sky-toolbox.jpg',2:'images/sticker-tassyu.jpg',3:'images/sticker-tapseung.jpg',4:'images/truck-frame-900.jpg',5:'images/truck-frame-1200.jpg',6:'images/valve-lock.jpg',7:'images/valve-lock.jpg',8:'images/valve-lock.jpg',9:'images/valve-lock.jpg',10:'images/valve-lock.jpg',11:'images/valve-lock.jpg'};
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const num=v=>Number(v||0).toLocaleString('ko-KR');
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
async function api(payload){
  if(!payload){const r=await fetch(API,{cache:'no-store'});return r.json()}
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  return r.json();
}
async function load(){
  $('#refresh').disabled=true;
  try{const data=await api();if(!data.success)throw new Error(data.message||'데이터 오류');products=data.products||[];sales=data.sales||[];renderAll();$('#updated').textContent='마지막 동기화 '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}
  catch(e){$('#inventoryLoading').textContent='데이터를 불러오지 못했습니다. 새로고침해주세요.';toast('연결을 다시 확인해주세요')}
  finally{$('#refresh').disabled=false}
}
function renderAll(){
  $('#productCount').textContent=num(products.length);$('#totalStock').textContent=num(products.reduce((s,p)=>s+Number(p.stock||0),0));$('#lowCount').textContent=num(products.filter(p=>Number(p.stock)<=Number(p.safetyStock)).length);
  const selected=$('#product').value;$('#product').innerHTML='<option value="">제품을 선택하세요</option>'+products.map(p=>`<option value="${p.id}">${p.name} (재고 ${num(p.stock)})</option>`).join('');$('#product').value=selected;
  renderInventory();renderHistory();
}
function renderInventory(){
  const q=$('#search').value.trim().toLowerCase(), f=$('#filter').value;
  const list=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(f!=='low'||Number(p.stock)<=Number(p.safetyStock)));
  $('#inventoryLoading').hidden=true;$('#inventoryTable').hidden=false;
  $('#inventoryBody').innerHTML=list.length?list.map(p=>{const low=Number(p.stock)<=Number(p.safetyStock),ratio=Math.min(100,Math.max(6,Number(p.stock)/Math.max(1,Number(p.made))*100)),image=PRODUCT_IMAGES[Number(p.id)]||'app-icon.png';return `<tr><td class="name"><div class="product-main"><img class="product-thumb" src="${image}" alt="${p.name}" loading="lazy" onerror="this.onerror=null;this.src='app-icon.png'"><div class="product-copy"><span class="product-title">${p.name}</span><div class="stock-track"><i style="width:${ratio}%"></i></div></div></div></td><td>${num(p.made)}</td><td>${num(p.sold)}</td><td class="stock ${low?'low':''}">${num(p.stock)}</td><td><span class="badge ${low?'low':''}">${low?'재고주의':'정상'}</span></td></tr>`}).join(''):'<tr><td colspan="5">조건에 맞는 제품이 없습니다.</td></tr>';
}
function renderHistory(){
  $('#historyList').innerHTML=sales.length?sales.slice().reverse().slice(0,50).map(s=>`<article class="history-item"><strong>${s.name||s.productName||'제품'}</strong><time>${s.saleDate||s.date||''} · ${s.channel||s.salesChannel||s.store||''}</time><b>−${num(s.quantity||s.qty)}개</b></article>`).join(''):'<div class="empty">등록된 판매내역이 없습니다.</div>';
}
$$('.tab').forEach(b=>b.addEventListener('click',()=>{$$('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.tab).classList.add('active')}));
$('#search').addEventListener('input',renderInventory);$('#filter').addEventListener('change',renderInventory);$('#refresh').addEventListener('click',load);
$$('[data-step]').forEach(b=>b.addEventListener('click',()=>{$('#quantity').value=Math.max(1,Number($('#quantity').value||1)+Number(b.dataset.step))}));
$('#saleForm').addEventListener('submit',async e=>{
  e.preventDefault();const id=Number($('#product').value), product=products.find(p=>Number(p.id)===id), quantity=Number($('#quantity').value);
  if(!product)return toast('제품을 선택해주세요');if(quantity<1)return toast('판매수량을 확인해주세요');if(quantity>Number(product.stock))return toast('현재 재고보다 많이 등록할 수 없습니다');
  const btn=$('#saleSubmit');btn.disabled=true;btn.textContent='등록 중...';
  try{const channel=$('#channel').value,note=$('#note').value.trim(),saleDate=$('#saleDate').value;const data=await api({action:'addSale',productId:id,id:id,productName:product.name,name:product.name,quantity:quantity,qty:quantity,saleDate:saleDate,date:saleDate,channel:channel,salesChannel:channel,salePlace:channel,note:note});if(!data.success)throw new Error(data.message||'등록 실패');toast('판매가 등록되었습니다');$('#quantity').value=1;$('#note').value='';await load();$$('.tab')[0].click()}
  catch(err){toast(err.message||'등록 중 오류가 발생했습니다')}
  finally{btn.disabled=false;btn.textContent='판매 등록하기'}
});
$('#saleDate').value=new Date().toISOString().slice(0,10);load();
</script>
</body>
</html>
